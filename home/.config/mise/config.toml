[bootstrap.macos.defaults.NSGlobalDomain]
NSWindowResizeTime = 0.001
ApplePressAndHoldEnabled = false
KeyRepeat = 1
InitialKeyRepeat = 10
NSNavPanelExpandedStateForSaveMode = true
NSNavPanelExpandedStateForSaveMode2 = true
PMPrintingExpandedStateForPrint = true
PMPrintingExpandedStateForPrint2 = true
NSAutomaticWindowAnimationsEnabled = false
AppleShowAllExtensions = true

[bootstrap.macos.defaults."com.apple.finder"]
QuitMenuItem = true
DisableAllAnimations = true
ShowStatusBar = true
_FXSortFoldersFirst = true
FXDefaultSearchScope = "SCcf"
FXEnableExtensionChangeWarning = false
FXPreferredViewStyle = "Nlsv"
OpenWindowForNewRemovableDisk = true

[bootstrap.macos.defaults."com.apple.frameworks.diskimages"]
auto-open-ro-root = true
auto-open-rw-root = true
skip-verify = true
skip-verify-locked = true
skip-verify-remote = true

[bootstrap.macos.defaults."com.apple.dock"]
tilesize = 36
launchanim = false
expose-animation-duration = 0.1
autohide-delay = 0.0
autohide-time-modifier = 0.0
show-recents = false
size-immutable = true

[bootstrap.macos.defaults."com.apple.print.PrintingPrefs"]
"Quit When Finished" = true

[bootstrap.macos.defaults."com.apple.LaunchServices"]
LSQuarantine = false

[bootstrap.macos.defaults."com.apple.desktopservices"]
DSDontWriteNetworkStores = true
DSDontWriteUSBStores = true

[bootstrap.macos.defaults."com.apple.TimeMachine"]
DoNotOfferNewDisksForBackup = true

[bootstrap.macos.defaults."com.apple.HIToolbox"]
AppleFnUsageType = 2

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

[bootstrap.hooks.final]
run = "mise bootstrap status --missing"

[tasks."sync:all"]
description = "Pull, re-apply dotfiles, and update dependencies"
run = ['git -C "$DOTFILES_ROOT" pull --ff-only', "mise run sync:after-repo"]

[tasks."sync:repo"]
description = "Fast-forward the dotfiles repository"
run = 'git -C "$DOTFILES_ROOT" pull --ff-only'

[tasks."sync:tools"]
description = "Upgrade and prune mise-managed tools"
run = '''
set -euo pipefail

export MISE_FETCH_REMOTE_VERSIONS_TIMEOUT=100
mise upgrade --yes
mise prune --yes
mise reshim --yes
'''

[tasks."sync:packages"]
description = "Install and upgrade machine-global packages"
run = '''
set -euo pipefail

ollama_before="$(brew list --versions ollama 2>/dev/null || true)"
mise bootstrap packages apply --yes
mise bootstrap packages upgrade --yes
ollama_after="$(brew list --versions ollama 2>/dev/null || true)"

if [[ "$ollama_before" != "$ollama_after" ]]; then
  brew services restart ollama
else
  brew services start ollama
fi
'''

[tasks."sync:deps"]
description = "Update tools and machine-global packages"
run = [{ task = "sync:tools" }, { task = "sync:packages" }]

[tasks."sync:after-repo"]
hide = true
run = ["mise dotfiles apply --yes", { task = "sync:deps" }]

[tasks.bootstrap]
description = "Start background services"
run = "brew services start ollama"
